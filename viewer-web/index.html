<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RQ4D viewer</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: rgba(17, 24, 33, 0.88);
    --line: rgba(148, 176, 208, 0.16);
    --text: #dbe6f2;
    --dim: #7d8fa3;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .panel {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    backdrop-filter: blur(12px);
  }

  #head { top: 12px; left: 12px; display: flex; align-items: center; gap: 10px; }
  #title { font-weight: 600; letter-spacing: 0.06em; }
  #link { color: var(--dim); }

  #link-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #64748b; flex: none;
    box-shadow: 0 0 0 3px rgba(100, 116, 139, 0.18);
  }
  #link-dot[data-state="connected"] { background: #4ade80; box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.18); }
  #link-dot[data-state="connecting"] { background: #fbbf24; box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.18); }
  #link-dot[data-state="offline"] { background: #f87171; box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.18); }
  #link-dot[data-tracking="limited"] { outline: 1px dashed #fbbf24; outline-offset: 3px; }
  #link-dot[data-tracking="lost"] { outline: 1px dashed #f87171; outline-offset: 3px; }

  #metrics { top: 12px; right: 12px; min-width: 208px; }
  #metrics h2 {
    margin: 0 0 6px; font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--dim); font-weight: 600;
  }
  #metrics + #metrics { margin-top: 8px; }
  #host-panel { top: 128px; right: 12px; min-width: 208px; }
  .grid { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
  .grid .k { color: var(--dim); }
  .grid .v { text-align: right; font-variant-numeric: tabular-nums; }

  #controls { bottom: 12px; left: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    font: inherit; color: var(--text); cursor: pointer;
    background: rgba(56, 189, 248, 0.06);
    border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 10px;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: rgba(56, 189, 248, 0.16); }
  button.active { border-color: var(--accent); color: var(--accent); background: rgba(56, 189, 248, 0.14); }

  #clip-wrap { display: flex; align-items: center; gap: 6px; color: var(--dim); padding-left: 4px; }
  #clip { width: 96px; accent-color: var(--accent); }
  #clip-value { min-width: 42px; font-variant-numeric: tabular-nums; }

  #legend {
    bottom: 12px; right: 12px; display: none; gap: 10px; align-items: center;
  }
  #legend.visible { display: flex; }
  #legend span { display: flex; align-items: center; gap: 5px; color: var(--dim); }
  #legend i { width: 10px; height: 10px; border-radius: 2px; display: block; }

  #toast {
    left: 50%; bottom: 64px; transform: translateX(-50%) translateY(8px);
    opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
  }
  #toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

  #hint {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: var(--dim); font-size: 11px; pointer-events: none;
  }

  @media (max-width: 720px) {
    #metrics, #host-panel { display: none; }
    #hint { display: none; }
  }
</style>
</head>
<body>
  <canvas id="view"></canvas>

  <div class="panel" id="head">
    <div id="link-dot" data-state="connecting"></div>
    <div id="title">RQ4D</div>
    <div id="link">connecting…</div>
  </div>

  <div class="panel" id="metrics">
    <h2>viewer</h2>
    <div class="grid" id="stats"></div>
  </div>

  <div class="panel" id="host-panel">
    <h2>host</h2>
    <div class="grid" id="host-stats"></div>
  </div>

  <div class="panel" id="controls">
    <button data-mode="solid" class="active">solid</button>
    <button data-mode="age">freshness</button>
    <button data-mode="wire">wireframe</button>
    <button id="toggle-room" class="active">room</button>
    <button id="toggle-grid" class="active">grid</button>
    <button id="refit">refit</button>
    <label id="clip-wrap">cut <input id="clip" type="range" min="0" max="3" step="0.05" value="3"><span id="clip-value">off</span></label>
    <button id="recalibrate">recalibrate</button>
  </div>

  <div class="panel" id="legend">
    <span><i style="background:#4ade80"></i>&lt;1s</span>
    <span><i style="background:#86efac"></i>3s</span>
    <span><i style="background:#fde047"></i>8s</span>
    <span><i style="background:#fb923c"></i>20s</span>
    <span><i style="background:#64748b"></i>stale</span>
  </div>

  <div class="panel" id="toast"></div>
  <div id="hint">drag to orbit · shift-drag or right-drag to pan · scroll to zoom</div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
